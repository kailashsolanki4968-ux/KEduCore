name: Build KEduCore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract KEduCore project
        run: |
          rm -rf project
          mkdir project
          unzip -q keducore.zip -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Android project files not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KEduCore-APK
          path: project/**/build/outputs/apk/**/*.apk
